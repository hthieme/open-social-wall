name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build plugin ZIP
        run: zip -r open-social-wall-${GITHUB_REF_NAME}.zip open-social-wall -x '*.DS_Store'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "open-social-wall-${GITHUB_REF_NAME}.zip" --generate-notes --title "Open Social Wall ${GITHUB_REF_NAME}"
