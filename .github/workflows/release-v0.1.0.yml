name: Publish v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build installable plugin ZIP
        run: zip -r open-social-wall-v0.1.0.zip open-social-wall -x '*.DS_Store'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 open-social-wall-v0.1.0.zip \
            --target "$GITHUB_SHA" \
            --title "Open Social Wall v0.1.0" \
            --notes "Initial public release of Open Social Wall.\n\nHighlights:\n- Mastodon RSS and Pixelfed Atom aggregation\n- Optional additional RSS/Atom feeds with custom display names\n- Chronological mixed feed\n- Responsive masonry-style layout\n- Centered source filter bar\n- Full post text and media\n- Client-side Load more pagination\n- WordPress transient caching\n\nFeedback, bug reports and contributions are welcome."

# One-time workflow used to publish the initial v0.1.0 release.
